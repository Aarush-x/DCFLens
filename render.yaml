services:
  - type: web
    name: dcflens-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CACHE_TTL_SECONDS
        value: "900"
      - key: CACHE_MAX_ENTRIES
        value: "16"
      - key: SEC_TIMEOUT_SECONDS
        value: "15"
      - key: SEC_MAX_RETRIES
        value: "2"
      - key: MARKET_QUOTE_ENABLED
        value: "true"
      - key: MARKET_QUOTE_TIMEOUT_SECONDS
        value: "5"
      - key: MARKET_QUOTE_MAX_RETRIES
        value: "1"
      - key: MARKET_QUOTE_TTL_SECONDS
        value: "60"
      - key: MARKET_QUOTE_FAILURE_TTL_SECONDS
        value: "30"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: GOOGLE_API_KEY
        sync: false
      - key: SEC_IDENTITY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # sync: false so the UA can be rotated from the dashboard in minutes if
      # Yahoo starts filtering on it -- no commit, no redeploy. The in-code
      # default in app/core/settings.py covers the unset case.
      - key: MARKET_QUOTE_USER_AGENT
        sync: false
